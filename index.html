<script>
// ⚠️ PEGA AQUÍ TU LINK MODIFICADO TERMINANDO EN /export?format=csv
const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/1Iffh-VbZUFFYpI5sVI8HQAz6IPgACs_W2sq0iEH4iVo/export?format=csv"; 

window.addEventListener("3dvista_loaded", function() {
    fetch(URL_GOOGLE_SHEETS)
    .then(response => response.text())
    .then(csvText => {
        let filas = csvText.split("\n");
        let mapeo_lotes = {};
        
        filas.forEach(fila => {
            let columnas = fila.split(",");
            if(columnas.length >= 2) {
                let nombre = columnas[0].trim();
                let estado = columnas[1].trim().toLowerCase();
                mapeo_lotes[nombre] = estado;
            }
        });

        // Esperamos a que el render de 3DVista monte los hotspots en pantalla
        setTimeout(() => {
            if (window.pano && window.pano.getPanoramas) {
                let panos = window.pano.getPanoramas();
                
                // Buscamos los lotes en todos los panoramas del recorrido
                panos.forEach(p => {
                    for (let nombreLote in mapeo_lotes) {
                        let estado = mapeo_lotes[nombreLote];
                        let hotspot = p.getHotspot(nombreLote);
                        
                        if (hotspot) {
                            if (estado === "vendido") {
                                hotspot.set("fillColor", "#FF0000"); // Rojo
                                hotspot.set("lineColor", "#FF0000");
                                hotspot.set("fillOpacity", 0.6);
                            } else if (estado === "disponible") {
                                hotspot.set("fillColor", "#00FF00"); // Verde
                                hotspot.set("lineColor", "#00FF00");
                                hotspot.set("fillOpacity", 0.6);
                            }
                            if (typeof hotspot.update === "function") hotspot.update();
                        }
                    }
                });
            }
        }, 2500); 
    })
    .catch(error => console.error('Error al conectar con Google Sheets:', error));
});
</script>
